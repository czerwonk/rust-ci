name: Publish to crates.io

on:
  workflow_call:
    inputs:
      packages:
        required: true
        type: string
        description: >
          JSON array of package names to publish, in dependency order,
          e.g. ["my-lib", "my-cli"]
      version-manifest:
        type: string
        default: ""
        description: >
          Path to the Cargo.toml whose `version` field must match the
          pushed tag (vX.Y.Z); version check is skipped if left empty

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: inputs.version-manifest != ''
        run: |
          VERSION=$(grep '^version = ' "${{ inputs.version-manifest }}" | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Cargo.toml version: $VERSION"
          echo "Git tag version: $TAG_VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch! ${{ inputs.version-manifest }} has $VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for pkg in $(echo '${{ inputs.packages }}' | jq -r '.[]'); do
            echo "Publishing $pkg to crates.io..."
            cargo publish -p "$pkg" --token "$CARGO_REGISTRY_TOKEN"
          done
